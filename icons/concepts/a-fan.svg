      <rect x="86" y="286" width="140" height="28" rx="14" fill="url(#bar)"/>
      <rect x="86" y="336" width="140" height="28" rx="14" fill="#38c9f5" opacity=".6" filter="url(#glow)"/>
      <rect x="86" y="336" width="140" height="28" rx="14" fill="url(#bar)"/>
