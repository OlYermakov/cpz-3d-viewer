    <ellipse cx="320" cy="210" rx="170" ry="150" fill="#1aa3d8" opacity=".35" filter="url(#haze)"/>
    <g stroke="#9fe0ff" stroke-opacity=".35" stroke-width="2">
      <rect x="196" y="104" width="196" height="300" rx="30" fill="url(#back)" transform="rotate(30 240 470)" opacity=".7"/>
      <rect x="190" y="98" width="196" height="306" rx="30" fill="url(#back)" transform="rotate(20 240 470)" opacity=".8"/>
      <rect x="184" y="92" width="196" height="312" rx="30" fill="url(#back)" transform="rotate(10 240 470)" opacity=".9"/>
      <path d="M128 148a30 30 0 0 1 30-30h118l76 76v226a30 30 0 0 1-30 30H158a30 30 0 0 1-30-30z" fill="url(#front)"/>
      <path d="M276 118v46a30 30 0 0 0 30 30h46z" fill="url(#curl)"/>
